# Builds and deploys the app to Fly.io on every push to main.
# Needs the FLY_API_TOKEN repository secret (Settings > Secrets and variables > Actions).
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-fly

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
